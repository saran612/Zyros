[workspace]
members = [
    "cli",
    "crates/zyros-core",
    "crates/zyros-nlu",
    "crates/zyros-planner",
    "crates/zyros-executor",
    "crates/zyros-explainer",
    "crates/zyros-commands",
    "crates/zyros-llm",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4.4", features = ["derive"] }
tauri = { version = "1.5" }
